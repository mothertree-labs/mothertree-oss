version: 2

# ONE pull request per week for every dependency Dependabot can see.
#
# This file used to declare the same ecosystem once per directory, which is one
# PR per directory: three npm PRs on Monday (#723, #724, #725), three terraform
# PRs on Tuesday, three docker PRs on Wednesday. Two keys collapse that to one:
#
#   * `directories` (plural) + a `groups` block  -> one PR per ecosystem,
#     spanning every directory listed for it.
#   * `multi-ecosystem-groups` + `multi-ecosystem-group` on each entry
#     -> those per-ecosystem PRs merge into a single cross-ecosystem PR.
#
# Each entry joining the group MUST also carry an entry-level `patterns:`. This
# is easy to miss and expensive to get wrong: the JSON schema at
# json.schemastore.org/dependabot-2.0.json states the requirement only in the
# `patterns` property DESCRIPTION, not in a conditional, so a config missing it
# validates clean and is then rejected by GitHub. A rejected dependabot.yml does
# not fall back to the old behaviour -- Dependabot stops for this repo entirely
# and silently, security updates included. The schema DOES encode the
# neighbouring rule ("Schedule is required UNLESS multi-ecosystem-group is
# specified"), which is why the entries below carry no `schedule` of their own.
#
# The per-ecosystem `groups` blocks are kept as belt-and-braces, NOT as a
# fallback -- there is no graceful degradation here and it would be wrong to
# reason as if there were. These entries carry no `schedule` of their own, so if
# the multi-ecosystem machinery were ignored they would be schedule-less and
# invalid, not quietly demoted to per-ecosystem PRs. The blocks are
# redundant-while-honoured; keep them because within-ecosystem grouping is then
# stated explicitly rather than inferred, and remove them only alongside a
# `schedule` on each entry.
#
# VERIFY AFTER MERGE. Schema-valid is not server-accepted, and a rejected
# dependabot.yml fails silently: Insights -> Dependency graph -> Dependabot
# should list the `weekly-deps` group with no config-error banner. If it does
# not, revert -- do not debug it live, because version updates are stopped for
# the whole repo meanwhile. Confirm again at the first Monday run that ONE PR
# appears rather than three.
#
# Security updates are unaffected by any of this: they are repo-level, are not
# folded into a multi-ecosystem group (version updates only), are not grouped
# (`groups` defaults to applies-to: version-updates), and are explicitly exempt
# from `open-pull-requests-limit`. A weekly PR blocked by one bad bump therefore
# cannot stall a security fix. The carve-out that WOULD break that is
# `target-branch`, which is deliberately absent. `ignore` rules, by contrast, DO
# apply to security updates -- both rules below are verified inert in the
# directories they newly reach.
#
# One PR also means one branch to freeze: dependabot-version-bump.yml pushes a
# commit onto the bot branch, and Dependabot stops rebasing a branch carrying
# foreign commits (#671). That used to freeze 1 of 9 PRs; it now freezes the
# only one. It fires on any apps/{admin-portal,account-portal,docker/roundcube}
# change, so this is the common path, not an edge case. Remedy: @dependabot
# rebase.
#
# Trade-off, stated plainly: one PR means one bad bump blocks every other bump
# in it, and each PR costs a full dev deploy plus ten e2e shards. That is the
# same bargain renovate.json5 makes for image tags and charts -- see its header,
# and the note there about using `allowedVersions` rather than pushing a revert
# when one bump in a batch goes bad.
#
# Renovate owns everything Dependabot cannot parse (image tags in YAML, helmfile
# charts, Ansible pins, heredocs). Keep the two from overlapping or the same
# bump opens twice.
multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: "weekly"
      day: "monday"
    # Merges with the per-ecosystem labels below rather than replacing them.
    labels:
      - "dependencies"
    # Belongs HERE, not on an entry. GitHub rejected the whole file for having
    # it on the npm entry: "open-pull-requests-limit should only be set on the
    # associated multi-ecosystem group, not directly on updates that are part
    # of a multi-ecosystem update group." Neither the JSON schema nor any
    # validator catches that -- it is another server-side-only rule, like the
    # `patterns` requirement above. Largely moot at one PR a week; kept because
    # the npm entry carried 10 before consolidation.
    open-pull-requests-limit: 10

updates:
  # npm: both portals + calendar automation.
  - package-ecosystem: "npm"
    directories:
      - "/apps/admin-portal"
      - "/apps/account-portal"
      - "/apps/calendar-automation"
    multi-ecosystem-group: "weekly-deps"
    # REQUIRED alongside multi-ecosystem-group -- see the header note.
    patterns: ["*"]
    labels:
      - "npm"
    groups:
      all-deps:
        patterns: ["*"]
    ignore:
      # Affects the two portals only in practice: calendar-automation depends on
      # ical.js, imapflow and node-fetch, and openid-client appears nowhere in
      # its package-lock.json either, so hoisting this to a shared entry is
      # inert there. openid-client >=6 is held deliberately -- see #404.
      - dependency-name: "openid-client"
        versions: [">=6"]

  # Terraform provider constraints -- every root, and every module a root calls.
  #
  # This list is a correctness requirement, not coverage for its own sake
  # (#699). Terraform intersects a provider constraint across a root config AND
  # every module that root calls, and `linode/linode` is declared independently
  # in all six directories below, today all at `~> 4.0`. The intersecting edge
  # is root <-> its own modules, NOT root <-> root: phase1 calls
  # modules/{headscale,lke-cluster,postgres-server}; phase1-dev calls
  # modules/lke-cluster; ci/terraform calls none. linode is the widest edge but
  # not the only one -- `hashicorp/null ~> 3.0` is a second phase1 <->
  # modules/postgres-server edge this now covers. Bump one side of an edge on
  # its own and the constraint resolves to the empty set -- `terraform init`
  # fails with "no available releases match". Not hypothetical: PR #504 fixed
  # exactly this by hand for the linode 3.9 -> 4.0 bump.
  #
  # What CI already catches. ci/scripts/terraform-validate.sh runs on every PR
  # (.woodpecker/validate.yaml, `event: pull_request`) and does
  # `terraform init -backend=false` in phase1 and ci/terraform (infra is in the
  # loop but always hits "Skipping infra (not found)" -- no tracked files). Module
  # installation and provider selection still run under -backend=false, so a
  # split bump on the phase1 edge DOES fail that step -- a red PR needing a
  # hand-fix, the #504 pattern, not a silent break.
  #
  # The genuine blind spot is phase1-dev: it is NOT in that loop, and it calls
  # modules/lke-cluster, so a constraint left behind on that edge stays
  # invisible until an operator runs dev phase1.
  #
  # So this buys two things: Dependabot stops proposing split bumps that CI then
  # rejects, and the phase1-dev edge stops drifting silently. The point is not
  # that more directories are watched but that they move TOGETHER in one PR.
  #
  # modules/helm-bootstrap is deliberately NOT listed. The discriminating
  # reason is that NO ROOT SOURCES IT -- `hashicorp/helm` appears in zero root
  # lock files, so it is never installed by anything. "Shares no provider" is
  # not the criterion and would over-exclude: modules/lke-cluster declares
  # `hashicorp/dns ~> 3.0` and phase1-dev declares `hashicorp/local ~> 2.0`,
  # each unshared, and both are listed because a root calls them.
  #
  # Those two are also the honest cost of this change: they are new update
  # streams (dns 3.x -> 4.x, local 2.x -> 3.x) that by definition cannot "move
  # together" with anything. The first dns bump WILL arrive red, not merely may:
  # `~> 3.0` already admits every 3.x release, so Dependabot proposes nothing
  # until 4.0 exists, and `~> 4.0` necessarily excludes the locked 3.6.2. Modules
  # carry no lock, phase1's lock pins dns 3.6.2 with `constraints = "~> 3.0"`,
  # so a constraint bump with no lock update fails `terraform init` on a locked-
  # provider mismatch. Fixing it is `init -upgrade` plus committing both roots'
  # locks: the #504 pattern again. (phase1 and phase1-dev already drift on
  # local -- 2.7.0 transitive vs 2.9.0 pinned.)
  #
  # `/infra` stays absent: zero files tracked in git -- what is on disk is local
  # state (.terraform/, terraform.tfstate). Note .terraform.lock.hcl IS tracked
  # for phase1 and phase1-dev (.gitignore ignores the pattern, then un-ignores
  # those two) and is NOT tracked for ci/terraform or the modules.
  #
  # TWO residual gaps this does not close, recorded so they are not mistaken
  # for solved:
  #
  #   1. dependabot-core #15097 is an open, DETERMINISTIC SystemStackError in
  #      the terraform FileFetcher, triggered by the multi-directory
  #      `directories:` array itself. Read the issue before growing this list:
  #      "The crash happens before any update can be attempted, so the entire
  #      scheduled run aborts and no PRs are opened or refreshed." Terraform
  #      shares the weekly-deps group with npm and docker, so if it fires the
  #      WHOLE weekly batch silently produces nothing -- visible only as a
  #      failed job at Insights -> Dependency graph -> Dependabot.
  #
  #      Our shape resembles the reported repro: it used 8 sibling directories
  #      each with a required_providers block and one provider pinned in every
  #      one; this list is 6 of broadly that shape, up from 2 -- though theirs
  #      were flat siblings and ours sit at two tree depths across three parent
  #      directories (root, ci/, modules/), and the crash
  #      frame is path normalization, so topology may matter either way. It is NOT a
  #      function of .tf file count -- the reporter's traces are Ruby's default
  #      stack depth, not a finite repetition. So CHECK THE TERRAFORM JOB after
  #      merge, and revert this commit if it is failing.
  #
  #      Separately, and regardless of #15097: `directories` resolution is
  #      per-directory, so grouping guarantees one PR, not one atomic
  #      resolution -- and a directory silently missing from a bump looks the
  #      same as one that had nothing to bump. Check a terraform bump's diff
  #      BEFORE merging, with an assertion rather than by eye:
  #        git grep -A1 'linode/linode' -- '*.tf' | grep -o '~> [0-9.]*' | sort -u
  #          -> must print ONE line. Two lines means a split bump, whether
  #             Dependabot skipped a directory or bumped it separately: a
  #             skipped directory KEEPS its declaration at the old constraint,
  #             so counting lines would still say 6 and tell you nothing.
  #
  #      A different assertion catches the watch list itself drifting out of
  #      sync -- run it when adding or removing a terraform directory, not on a
  #      bump:
  #        git grep -A1 'linode/linode' -- '*.tf' | grep -c version
  #          -> must equal the number of linode-declaring entries listed below
  #      Merging is what breaks `init`, so the file's usual "verify after
  #      merge" idiom does not apply here.
  #
  #   2. A provider declared ONLY in a module is still not self-healing.
  #      `hashicorp/dns ~> 3.0` lives only in modules/lke-cluster but is locked
  #      in both roots (phase1 3.6.2, phase1-dev 3.6.1). Modules carry no lock
  #      file, so bumping that constraint updates no lock, and neither root's
  #      required_providers mentions dns. phase1 catches the mismatch via
  #      terraform-validate; phase1-dev does not. This is genuinely new, and
  #      provable from config rather than history: the previous `directories:`
  #      list was exactly /phase1 and /ci/terraform, so Dependabot could not
  #      have proposed anything for these paths, and Renovate cannot reach them
  #      either (it runs no terraform manager). Do not try to establish this
  #      with `git log --author=dependabot` -- in a shallow clone the graft root
  #      reads as adding every file and returns a false hit.
  #
  # If the terraform updater starts crashing, revert the commit that added
  # these directories; it is deliberately self-contained.
  - package-ecosystem: "terraform"
    directories:
      - "/phase1"
      - "/phase1-dev"
      - "/ci/terraform"
      - "/modules/headscale"
      - "/modules/lke-cluster"
      - "/modules/postgres-server"
    multi-ecosystem-group: "weekly-deps"
    # REQUIRED alongside multi-ecosystem-group -- see the header note.
    patterns: ["*"]
    labels:
      - "terraform"
    groups:
      all-providers:
        patterns: ["*"]

  # Base images for the three Dockerfiles that feed dependabot-version-bump.yml.
  - package-ecosystem: "docker"
    directories:
      - "/apps/admin-portal"
      - "/apps/account-portal"
      - "/apps/docker/roundcube"
    multi-ecosystem-group: "weekly-deps"
    # REQUIRED alongside multi-ecosystem-group -- see the header note.
    patterns: ["*"]
    labels:
      - "docker"
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Portals are pinned to node 24 LTS: majors (25, 26, …) are bumped
      # deliberately in their own branch, not by Dependabot. The 20->25 incident
      # that first motivated this pin was openid-client 5->6 and the
      # connect-redis export shape, not Node itself -- see #404.
      #
      # Name-scoped to `node`, so it does NOT reach Roundcube, whose Dockerfile
      # is a single `FROM roundcube/roundcubemail:<tag>` with no node stage and
      # no `node` token anywhere in it. Roundcube stays intentionally unpinned:
      # upgrades including majors flow freely, and CI catches the common
      # breakage (deploy-roundcube.sh fails fast if a new image's rollout does
      # not go Ready, e.g. the 1.7 probe crash-loop fixed in #441; e2e covers
      # login). Residual risk no per-branch gate can catch: a major bump's
      # forward-only updatedb.sh migrating the SHARED dev Postgres and breaking
      # other concurrent old-version branches (the session.changed->expires_at
      # poison) -- review major Roundcube bumps with #430 in mind.
      #
      # If a node build stage is ever added to the Roundcube image, split it
      # into its own entry rather than letting this ignore reach it.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
