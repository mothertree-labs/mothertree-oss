---
# devhome periscope: the env's only public face. DNS (lb1.<label>.<domain>,
# mail.<label>.<domain>) points here; TCP is forwarded by HAProxy (PROXY v2),
# UDP media by iptables DNAT — both over the dev tailnet to the devhome box.
#
# Run: ansible-playbook -i <inventory> -e @<vars> periscope.yml
# Needs: headscale_url, ts_authkey_periscope, box_tailscale_ip,
#        devhome_forward_tcp ([{port, proxy}]), devhome_forward_udp ([port])
- name: Configure devhome periscope
  hosts: periscope
  become: true
  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - headscale_url | default('') | length > 0
          - box_tailscale_ip | default('') | length > 0
          - devhome_forward_tcp | default([]) | length > 0
        fail_msg: "headscale_url, box_tailscale_ip and devhome_forward_tcp are required"

    - name: Install HAProxy
      ansible.builtin.apt:
        name: [haproxy, iptables]
        update_cache: true

    - name: Install Tailscale
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Check tailnet membership
      ansible.builtin.command: tailscale ip -4
      register: _ts_ip
      changed_when: false
      failed_when: false

    - name: Join the dev tailnet
      ansible.builtin.command: >-
        tailscale up --login-server={{ headscale_url }}
        --authkey={{ ts_authkey_periscope }} --hostname=devhome-periscope
        --accept-dns=false
      when: _ts_ip.rc != 0 or (_ts_ip.stdout | trim) == ''
      no_log: true

    - name: Enable IP forwarding (UDP DNAT)
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true

    - name: Deploy HAProxy config
      ansible.builtin.template:
        src: periscope-haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        validate: haproxy -c -f %s
      notify: reload haproxy

    - name: Deploy UDP forward script
      ansible.builtin.template:
        src: periscope-udp-forward.sh.j2
        dest: /usr/local/sbin/periscope-udp-forward
        mode: "0755"
      register: _udp_script

    - name: Deploy UDP forward unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/periscope-udp-forward.service
        content: |
          [Unit]
          Description=devhome periscope UDP media forward
          After=network-online.target tailscaled.service
          Wants=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=true
          ExecStart=/usr/local/sbin/periscope-udp-forward
          [Install]
          WantedBy=multi-user.target
      register: _udp_unit

    - name: Enable UDP forward
      ansible.builtin.systemd:
        name: periscope-udp-forward
        enabled: true
        state: "{{ 'restarted' if (_udp_script.changed or _udp_unit.changed) else 'started' }}"
        daemon_reload: true

    - name: Enable HAProxy
      ansible.builtin.systemd:
        name: haproxy
        enabled: true
        state: started

  handlers:
    - name: reload haproxy
      ansible.builtin.systemd:
        name: haproxy
        state: reloaded
