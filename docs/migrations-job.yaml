apiVersion: batch/v1
kind: Job
metadata:
  name: docs-migrations
  namespace: docs
  labels:
    app.kubernetes.io/name: docs
    app.kubernetes.io/part-of: mother-tree
spec:
  # Matches the db-init Jobs. Without it a completed Job persists forever and
  # the next deploy of this tenant can fail with `AlreadyExists` (#667 class).
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs
        app.kubernetes.io/part-of: mother-tree
    spec:
      restartPolicy: Never
      containers:
        - name: backend
          image: lasuite/impress-backend:v5.7.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              python manage.py migrate --noinput
          envFrom:
            - configMapRef:
                name: docs-config
            - configMapRef:
                name: env-d-yprovider
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: docs-secrets
                  key: DJANGO_SECRET_KEY
            - name: COLLABORATION_SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: docs-secrets
                  key: COLLABORATION_SERVER_SECRET
            - name: Y_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: docs-secrets
                  key: Y_PROVIDER_API_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docs-secrets
                  key: DATABASE_PASSWORD
            - name: AWS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: docs-secrets
                  key: AWS_S3_ACCESS_KEY_ID
            - name: AWS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: docs-secrets
                  key: AWS_S3_SECRET_ACCESS_KEY
            - name: OIDC_RP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: docs-secrets
                  key: OIDC_RP_CLIENT_SECRET
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          # Same settings module as the backend (DJANGO_SETTINGS_MODULE=mt_settings
          # from docs-config), so the same three mounts are required or the
          # import fails before `migrate` runs.
          volumeMounts:
            - name: storage-backends
              mountPath: /app/storage_backends.py
              subPath: storage_backends.py
            - name: media-middleware
              mountPath: /app/impress/middleware.py
              subPath: middleware.py
            - name: mt-settings
              mountPath: /app/mt_settings.py
              subPath: mt_settings.py
              readOnly: true
            # subPath file mounts (an in-place ConfigMap edit cannot reach a
            # running container; picked up on the next container restart or
            # rollout), see backend-deployment.yaml.
            - name: mt-patches
              mountPath: /app/mt_patches/__init__.py
              subPath: __init__.py
              readOnly: true
            - name: mt-patches
              mountPath: /app/mt_patches/apps.py
              subPath: apps.py
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Short-lived job, but it runs the full Django app-import (boto3 +
          # malware_detection). On a cold/contended dev cluster a 100m CPU request
          # got starved during concurrent tenant deploys, stretching the import
          # from ~3s to ~3.5min and blowing the deploy poll. Give it real CPU so it
          # boots fast under contention; memory floor raised off the anomalous 64Mi.
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Pod Security "restricted"; migrate needs no writes under /app.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      # Image's own unprivileged user (USER 1001:127).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 127
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: storage-backends
          configMap:
            name: storage-backends
        - name: media-middleware
          configMap:
            name: storage-backends
            items:
              - key: middleware.py
                path: middleware.py
        - name: mt-settings
          configMap:
            name: docs-mt-python
            items:
              - key: mt_settings.py
                path: mt_settings.py
        - name: mt-patches
          configMap:
            name: docs-mt-python
            items:
              - key: __init__.py
                path: __init__.py
              - key: apps.py
                path: apps.py

