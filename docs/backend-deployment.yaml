apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: backend
    app.kubernetes.io/name: docs-backend
    app.kubernetes.io/part-of: mother-tree
  name: backend
  namespace: docs
spec:
  replicas: ${DOCS_BACKEND_MIN_REPLICAS}
  selector:
    matchLabels:
      io.kompose.service: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: docs
        app.kubernetes.io/name: docs
    spec:
      containers:
        - name: backend
          image: lasuite/impress-backend:v5.6.1
          # Customizations no longer rewrite files in the image at start-up.
          # DJANGO_SETTINGS_MODULE=mt_settings (docs-config) loads /app/mt_settings.py,
          # a subclass of upstream's Production that adds MediaMiddleware, the
          # Linode storage backend and the mt_patches app (invitation-email
          # link); all three are mounted read-only from ConfigMaps below and
          # fail closed at import if upstream drifts. gunicorn's config file is
          # still shipped by the image (upstream's default CMD is uvicorn).
          # --no-control-socket: gunicorn 26 would otherwise create
          # $HOME/.gunicorn/gunicorn.ctl, and HOME is / for the image's
          # unprivileged user ("Control server error: Permission denied");
          # nothing here uses the control interface.
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec gunicorn -c /usr/local/etc/gunicorn/impress.py --no-control-socket --workers ${DOCS_GUNICORN_WORKERS} --timeout 30 impress.wsgi:application
          ports:
          - containerPort: 8000
            name: http
          envFrom:
          - configMapRef:
              name: docs-config
          - configMapRef:
              name: env-d-yprovider
          volumeMounts:
          - name: storage-backends
            mountPath: /app/storage_backends.py
            subPath: storage_backends.py
          - name: media-middleware
            mountPath: /app/impress/middleware.py
            subPath: middleware.py
          - name: mt-settings
            mountPath: /app/mt_settings.py
            subPath: mt_settings.py
            readOnly: true
          # Two subPath file mounts rather than a directory mount: an in-place
          # ConfigMap edit cannot reach a running container; it is picked up on
          # the next container restart or rollout (kubelet re-resolves subPath
          # on container restart; mt_apply restarts on change). The container
          # runtime creates the missing /app/mt_patches parent for a
          # bind-mount destination (runc libcontainer createIfNotExists);
          # proved locally with docker single-file mounts.
          - name: mt-patches
            mountPath: /app/mt_patches/__init__.py
            subPath: __init__.py
            readOnly: true
          - name: mt-patches
            mountPath: /app/mt_patches/apps.py
            subPath: apps.py
            readOnly: true
          - name: tmp
            mountPath: /tmp
          env:
          # ConfigMap mounts are read-only; stop CPython trying to write
          # __pycache__ next to mt_settings.py / mt_patches/.
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
          - name: DJANGO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: docs-secrets
                key: DJANGO_SECRET_KEY
          - name: COLLABORATION_SERVER_SECRET
            valueFrom:
              secretKeyRef:
                name: docs-secrets
                key: COLLABORATION_SERVER_SECRET
          - name: Y_PROVIDER_API_KEY
            valueFrom:
              secretKeyRef:
                name: docs-secrets
                key: Y_PROVIDER_API_KEY
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: docs-secrets
                key: DATABASE_PASSWORD
          - name: AWS_S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: docs-secrets
                key: AWS_S3_ACCESS_KEY_ID
          - name: AWS_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: docs-secrets
                key: AWS_S3_SECRET_ACCESS_KEY
          - name: OIDC_RP_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: docs-secrets
                key: OIDC_RP_CLIENT_SECRET
          # SMTP credentials — tenant Stalwart submission listener on port 588.
          # Secret is written by scripts/provision-smtp-service-accounts.
          # `optional: true` lets the pod start on a fresh tenant before the
          # secret is provisioned; callers can't send mail until then. Impress
          # settings use the DJANGO_ prefix (django-configurations default).
          - name: DJANGO_EMAIL_HOST
            valueFrom:
              secretKeyRef:
                name: smtp-credentials
                key: SMTP_RELAY_HOST
                optional: true
          - name: DJANGO_EMAIL_PORT
            valueFrom:
              secretKeyRef:
                name: smtp-credentials
                key: SMTP_RELAY_PORT
                optional: true
          - name: DJANGO_EMAIL_HOST_USER
            valueFrom:
              secretKeyRef:
                name: smtp-credentials
                key: SMTP_RELAY_USERNAME
                optional: true
          - name: DJANGO_EMAIL_HOST_PASSWORD
            valueFrom:
              secretKeyRef:
                name: smtp-credentials
                key: SMTP_RELAY_PASSWORD
                optional: true
          startupProbe:
            httpGet:
              path: /__lbheartbeat__
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /__heartbeat__
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /__lbheartbeat__
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 3
          # Memory tuned: actual usage ~375Mi steady state
          resources:
            requests:
              cpu: 100m  # Minimum 100m to prevent HPA triggering on idle fluctuations
              memory: 400Mi
            limits:
              memory: 1Gi
          # Pod Security "restricted" (pod-level user/seccomp, see below).
          # Root filesystem is read-only: nothing under /app needs write and
          # gunicorn's worker heartbeat files go to the /tmp emptyDir.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      # Run as the image's own unprivileged user (USER 1001:127, no passwd
      # entry). Root was only ever needed for the pre-5.x in-place file patching.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 127
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      - name: storage-backends
        configMap:
          name: storage-backends
      - name: media-middleware
        configMap:
          name: storage-backends
          items:
            - key: middleware.py
              path: middleware.py
      - name: mt-settings
        configMap:
          name: docs-mt-python
          items:
            - key: mt_settings.py
              path: mt_settings.py
      - name: mt-patches
        configMap:
          name: docs-mt-python
          items:
            - key: __init__.py
              path: __init__.py
            - key: apps.py
              path: apps.py
      restartPolicy: Always
