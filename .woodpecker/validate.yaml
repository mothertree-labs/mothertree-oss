when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  - name: shellcheck
    image: bash
    commands:
      - ci/scripts/shellcheck.sh
    depends_on: []

  # Cluster-free unit tests for the shell libraries (stubbed kubectl / curl /
  # resolvers; no network). ci/scripts/shell-unit-tests.sh runs every
  # scripts/lib/tests/*.test.sh, scripts/tests/*.test.sh and
  # scripts/tests/test-*.sh — drop a new test file in and it is picked up.
  - name: shell-unit-tests
    image: bash
    commands:
      - ci/scripts/shell-unit-tests.sh
    depends_on: []

  - name: terraform-validate
    image: bash
    commands:
      - ci/scripts/terraform-validate.sh
    depends_on: []

  - name: helmfile-lint
    image: bash
    commands:
      - ci/scripts/helmfile-lint.sh
    depends_on: []

  # Renders the Vector ConfigMap and runs `vector validate` inside the exact
  # image the DaemonSet will run — catches config keys the new Vector version
  # dropped (chart bumps), which helmfile lint cannot see. Issue #612.
  - name: vector-config-validate
    image: bash
    commands:
      - ci/scripts/vector-validate.sh
    depends_on: []

  # Boots the Keycloak image pinned in apps/values/keycloak-codecentric.yaml with
  # apps/themes/platform mounted and drives the theme's passkey registration page
  # in Chromium with a virtual authenticator, clicking the page's own button.
  # Catches a template calling into a Keycloak resource the image no longer
  # ships (the dev-cluster e2e bypasses that page's script), and re-runs on
  # every Keycloak bump PR.
  - name: keycloak-theme-test
    image: bash
    environment:
      CI: "true"
    commands:
      - ci/scripts/keycloak-theme-test.sh
    depends_on: []

  - name: version-check
    image: bash
    commands:
      - ci/scripts/version-check.sh
    depends_on: []

  # npm steps must be sequential — they share the workspace and
  # concurrent npm ci in the same directory corrupts node_modules.
  - name: npm-check
    image: bash
    commands:
      - ci/scripts/npm-check.sh
    depends_on: []

  - name: account-portal-tests
    image: bash
    commands:
      - cd apps/account-portal
      - "[ -d node_modules ] || npm ci --ignore-scripts"
      - npm test
    depends_on: [npm-check]

  - name: admin-portal-tests
    image: bash
    commands:
      - ci/scripts/admin-portal-test.sh
    depends_on: [npm-check]

  # calendar-automation's unit suite (`node --test server.test.js`) had no CI
  # step at all; its only coverage was e2e. Same shape as account-portal-tests:
  # own directory, so it can run alongside the portal steps after npm-check.
  - name: calendar-automation-tests
    image: bash
    commands:
      - cd apps/calendar-automation
      - "[ -d node_modules ] || npm ci --ignore-scripts"
      - npm test
    depends_on: [npm-check]
