depends_on:
  - e2e-shard-1
  - e2e-shard-2
  - e2e-shard-3
  - e2e-shard-4
  - e2e-shard-5
  - e2e-shard-6
  - e2e-shard-7
  - e2e-shard-8
  - e2e-shard-9
  - e2e-shard-10

when:
  - event: pull_request
    status: [ success, failure ]
  - event: push
    branch: main
    status: [ success, failure ]

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  # Re-run the deploy health gate (scripts/infra-health-gate, see
  # deploy-dev-finalize.yaml) now that e2e has run for 15+ minutes: a pod that
  # crashes only later, or under e2e load, is caught here, and a rollout still
  # stuck by now is not "settling". Settle 200s: longer than the gate's 3m
  # crash-loop lookback, so a pod that crash-looped briefly during e2e and has
  # since recovered clears instead of failing the build; anything still
  # crashing or stuck after that fails it. Must run BEFORE release-tenant (the gate resolves the leased
  # tenant from the lease), and release-tenant runs whatever this step's
  # outcome so a failing gate never strands the lease (a cancelled or killed
  # pipeline still can, as before; the lease then expires on its TTL). The gate result is what
  # fails mothertree-build, which depends on this workflow.
  - name: workload-health-recheck
    image: bash
    environment:
      CI: "true"
      CI_VALKEY_PASSWORD:
        from_secret: ci_valkey_password
      DEPLOY_VAULT_PASSWORD:
        from_secret: deploy_vault_password
      GITHUB_PAT:
        from_secret: github_pat
      LINODE_CLI_TOKEN:
        from_secret: linode_token
      E2E_POOL1_TENANT:
        from_secret: e2e_pool1_tenant
      E2E_POOL2_TENANT:
        from_secret: e2e_pool2_tenant
      E2E_POOL1_BASE_DOMAIN:
        from_secret: e2e_pool1_base_domain
      E2E_POOL2_BASE_DOMAIN:
        from_secret: e2e_pool2_base_domain
      # keep in step with deploy-dev-finalize.yaml's infra-health-gate
      INFRA_GATE_IGNORE: "^pg-metrics-bridge(-|$$)"
      INFRA_GATE_SETTLE_SECONDS: "200"
    commands:
      - ci/scripts/ci-deploy-app.sh "$${MT_CI_DEV_ENV:-dev}" infra-gate

  - name: release-tenant
    when:
      - status: [ success, failure ]
    image: bash
    environment:
      CI: "true"
      CI_VALKEY_PASSWORD:
        from_secret: ci_valkey_password
      E2E_POOL1_TENANT:
        from_secret: e2e_pool1_tenant
      E2E_POOL1_BASE_DOMAIN:
        from_secret: e2e_pool1_base_domain
      E2E_POOL1_KC_REALM:
        from_secret: e2e_pool1_kc_realm
      E2E_POOL1_KC_CLIENT_SECRET:
        from_secret: e2e_pool1_kc_client_secret
      E2E_POOL2_TENANT:
        from_secret: e2e_pool2_tenant
      E2E_POOL2_BASE_DOMAIN:
        from_secret: e2e_pool2_base_domain
      E2E_POOL2_KC_REALM:
        from_secret: e2e_pool2_kc_realm
      E2E_POOL2_KC_CLIENT_SECRET:
        from_secret: e2e_pool2_kc_client_secret
      E2E_POOL1_STALWART_ADMIN_PASSWORD:
        from_secret: e2e_pool1_stalwart_admin_password
      E2E_POOL2_STALWART_ADMIN_PASSWORD:
        from_secret: e2e_pool2_stalwart_admin_password
    commands:
      - ci/scripts/ci-release-tenant.sh
