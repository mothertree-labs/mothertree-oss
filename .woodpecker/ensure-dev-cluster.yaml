# Checks that the dev-class CI cluster (devhome, a permanent k3s cluster) is
# reachable before the app deploys start. The name is from the retired
# on-demand LKE cluster, which this step used to create.
#
# Workflow-level `when` MUST match `deploy-dev-prep.yaml` — that workflow lists
# ensure-dev-cluster in its depends_on, and Woodpecker blocks a workflow if any
# dependency is filtered out for the current event. The workflow must exist in
# the DAG on both events so deploy-dev-prep can resolve — without this, the
# merge-to-main pipeline short-circuits BEFORE deploy-prod (pipelines #1216 /
# #1219).
when:
  - event: pull_request
  - event: push
    branch: main

depends_on:
  - validate
  - build-images
  - ci-lease

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  - name: ensure-dev-cluster
    image: bash
    environment:
      CI: "true"
      CI_VALKEY_PASSWORD:
        from_secret: ci_valkey_password
      DEPLOY_VAULT_PASSWORD:
        from_secret: deploy_vault_password
      GITHUB_PAT:
        from_secret: github_pat
      LINODE_CLI_TOKEN:
        from_secret: linode_token
      E2E_POOL1_TENANT:
        from_secret: e2e_pool1_tenant
      E2E_POOL2_TENANT:
        from_secret: e2e_pool2_tenant
      E2E_POOL1_BASE_DOMAIN:
        from_secret: e2e_pool1_base_domain
      E2E_POOL2_BASE_DOMAIN:
        from_secret: e2e_pool2_base_domain
    commands:
      - ci/scripts/ci-deploy.sh "$${MT_CI_DEV_ENV:-dev}" --bringup-only
