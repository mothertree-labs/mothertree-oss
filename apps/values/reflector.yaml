# emberstack/reflector — everything else is the chart's upstream default,
# which `wait: true` in the helmfile validates on every sync (a crash-looping
# controller fails the deploy; a wedged one is caught by the canary in
# deploy_infra, #673).
image:
  repository: docker.io/emberstack/kubernetes-reflector

# Single replica, watch-driven, no leader election. Requests match the
# controller's idle footprint (a small .NET service). The memory LIMIT is
# generous on purpose: the controller caches every watched Secret and
# ConfigMap cluster-wide, and an OOM loop between deploys would be exactly the
# silent failure mode the propagation gate exists for (#673) — the gate would
# catch it on the next deploy, but not before.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 512Mi
