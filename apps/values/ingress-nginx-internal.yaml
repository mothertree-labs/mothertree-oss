controller:
  kind: DaemonSet  # Use DaemonSet instead of Deployment to ensure pod on every node
                   # This way, NodePort with externalTrafficPolicy: Local works on all nodes
                   # Even if a node fails, other nodes can still handle traffic
  service:
    type: NodePort
    externalTrafficPolicy: Local  # Preserve source IP for NodePort
    nodePorts:
      http: 30080
      https: 30443
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  config:
    # Chart >= 4.8 disables snippet annotations by default and >= 4.12 rates them
    # Critical risk; keep parity with the external controller so snippet-bearing
    # ingresses render identically on both classes.
    allow-snippet-annotations: "true"
    annotations-risk-level: "Critical"
    # Basic nginx configuration for internal services
    use-proxy-protocol: "false"
    # No proxy sits in front of this controller (clients reach the NodePort
    # directly or through the Tailscale subnet router), so the TCP peer is the
    # client. Keep forwarded-header / real-ip handling off so the allowlist and
    # per-IP rate limits see that address.
    use-forwarded-headers: "false"
    enable-real-ip: "false"
    compute-full-forwarded-for: "false"
    # Restrict access to the allowlisted networks (deploy_infra sets the CIDRs)
    whitelist-source-range: "10.8.0.0/24"
  ingressClassResource:
    name: nginx-internal
    enabled: true
    default: false
    controllerValue: "k8s.io/ingress-nginx-internal"
  ingressClass: nginx-internal

# Disable admission webhook for internal ingress
admissionWebhooks:
  enabled: false

# Disable default backend
defaultBackend:
  enabled: false
