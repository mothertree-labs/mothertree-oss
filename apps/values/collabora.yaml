replicaCount: 1

autoscaling:
  enabled: false

collabora:
  extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:logging.level=information

# Memory request must reflect real usage: a Collabora pod observed at ~1GiB
# against a 512Mi request was first in line for kubelet eviction under node
# memory pressure (dev, 2026-08-15), leaving a ContainerStatusUnknown corpse
# that deploy waits then trip over.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

probes:
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 3
  readiness:
    enabled: true
  liveness:
    enabled: true
