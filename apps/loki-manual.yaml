apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: infra-monitoring
  labels:
    app: loki
data:
  config.yaml: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
    
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    
    # TSDB, not boltdb-shipper: since Loki 3.6 compactor retention on a
    # boltdb-shipper table fails on every chunk that spans midnight ("could not
    # find entry of chunk ... to remove it", grafana/loki#23358), and one failed
    # table aborts the whole run, so nothing was ever deleted. TSDB tables are
    # not affected. The distinct prefix keeps the compactor away from any old
    # boltdb index_<day> tables still on a volume: a table whose name does not
    # match its period's prefix is skipped. `from` predates any sample Loki
    # still accepts (reject_old_samples_max_age).
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: tsdb_index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
      filesystem:
        directory: /loki/chunks
    
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      allow_structured_metadata: false
      retention_period: 168h
      # Retention needs no delete API; with auth_enabled=false it would let any
      # pod that can reach Loki erase log streams.
      deletion_mode: disabled
    
    # Retention is enforced by the compactor. The table_manager settings this
    # replaced never deleted anything on a boltdb-shipper store: the compactor
    # had retention_enabled=false, so chunks accumulated since the PVC was made.
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: infra-monitoring
  labels:
    app: loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      name: http-metrics
    - port: 9095
      targetPort: 9095
      name: grpc
  selector:
    app: loki

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: infra-monitoring
  labels:
    app: loki

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: infra-monitoring
  labels:
    app: loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: loki
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: loki
          image: grafana/loki:3.7.9
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/config/config.yaml
            - -target=all
          ports:
            - name: http-metrics
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 30
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 30
            timeoutSeconds: 1
          volumeMounts:
            - name: config
              mountPath: /etc/loki/config
            - name: storage
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: linode-block-storage-retain
