# One-shot Job that populates the S3 model cache from ollama.com.
#
# Runs once per bucket lifetime (gated in deploy-llm.sh): the initContainer
# pulls the model into a shared emptyDir, then the main container syncs it up
# to s3://bucket/prefix/. Non-blocking — deploy_infra never waits on the pull.
# Finished Jobs self-delete 10 min after completion (ttlSecondsAfterFinished),
# so a failed seed (e.g. transient ollama.com outage) does not linger and make
# every future deploy skip re-seeding. To re-seed a wiped bucket immediately,
# delete this Job (if still present) and re-run deploy-llm.sh.
#
# Templated via envsubst (LLM_MODEL, LLM_S3_BUCKET, LLM_S3_PREFIX).
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-seed
  namespace: infra-llm
  labels:
    app.kubernetes.io/name: ollama-model-seed
    app.kubernetes.io/managed-by: mothertree
    mothertree/component: llm
spec:
  # Backstop: never hang the Job indefinitely (a stuck pull must surface as
  # a failed Job, not a silent never-completing one). 3600s covers a slow
  # model pull across the backoffLimit retries.
  activeDeadlineSeconds: 3600
  # Self-clean: succeeded Jobs vanish (the deploy's S3 check still gates
  # re-seeding), and a failed Job (backoffLimit exhausted) disappears so the
  # next deploy's gate retries instead of skipping forever.
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ollama-model-seed
        mothertree/component: llm
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: pull
          image: ollama/ollama:0.5.7
          command:
            - /bin/sh
            - -c
            - |
              # Pull is this init container's only job: exit as soon as it
              # succeeds — do NOT `wait` on the backgrounded ollama serve
              # (it never exits, which would hang the init container forever).
              # The pull's exit code must propagate (sh is dash — a pipe to
              # tail would mask it and report a failed pull as Complete, so
              # backoffLimit/Failed would never engage): log to a file instead.
              ollama serve &
              sleep 3
              until ollama list >/dev/null 2>&1; do sleep 1; done
              if ! ollama pull "${LLM_MODEL}" > /tmp/pull.log 2>&1; then
                tail -20 /tmp/pull.log >&2
                exit 1
              fi
              tail -5 /tmp/pull.log
          env:
            - name: LLM_MODEL
              value: "${LLM_MODEL}"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      containers:
        - name: upload
          image: amazon/aws-cli:2.22.35
          command:
            - /bin/sh
            - -c
            - |
              aws s3 sync --no-progress /root/.ollama s3://${LLM_S3_BUCKET}/${LLM_S3_PREFIX}
          envFrom:
            - secretRef:
                name: ollama-s3
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          emptyDir: {}
